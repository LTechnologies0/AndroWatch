android:
  - changed-files:
      - any-glob-to-any-file:
          - "app/**"
          - "collector/**"
          - "core/**"
          - "feature/**"
          - "**/*.kt"
          - "**/AndroidManifest.xml"

documentation:
  - changed-files:
      - any-glob-to-any-file:
          - "**/*.md"
          - "docs/**"

dependencies:
  - changed-files:
      - any-glob-to-any-file:
          - "**/build.gradle.kts"
          - "gradle/**"
          - ".github/dependabot.yml"

ci/cd:
  - changed-files:
      - any-glob-to-any-file:
          - ".github/workflows/**"
          - ".github/dependabot.yml"

security:
  - changed-files:
      - any-glob-to-any-file:
          - "SECURITY.md"
          - "gradle/privacy-logging.pro"
          - "gradle/release-signing.gradle"
          - ".github/workflows/scorecard.yml"

i18n:
  - changed-files:
      - any-glob-to-any-file:
          - "**/res/values*/**"
