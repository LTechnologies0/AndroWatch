name: Stale

on:
  schedule:
    - cron: "0 7 * * 1"
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@v9
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          days-before-stale: 60
          days-before-close: 14
          stale-issue-label: stale
          stale-pr-label: stale
          stale-issue-message: >
            This issue has been inactive for 60 days and will be closed in 14 days
            if there is no further activity. Comment to keep it open.
          stale-pr-message: >
            This pull request has been inactive for 60 days and will be closed in 14 days
            if there is no further activity.
          exempt-issue-labels: security,enhancement,bug
          exempt-pr-labels: security,dependencies
          operations-per-run: 100
