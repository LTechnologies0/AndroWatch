name: Greetings

on:
  issues:
    types: [opened]
  pull_request_target:
    types: [opened]

permissions:
  issues: write
  pull-requests: write

jobs:
  greet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/first-interaction@v1
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          issue-message: |
            Thanks for opening an issue on **AndroWatch**!

            - Check [docs/ARCHITECTURE.md](https://github.com/LTechnologies0/AndroWatch/blob/main/docs/ARCHITECTURE.md) for module layout
            - For security issues, use **private vulnerability reporting** (see SECURITY.md)
          pr-message: |
            Thanks for your pull request!

            CI will run unit tests, assemble a debug APK, and run CodeQL.
            Please add KDoc for new public APIs and ensure no secrets are committed.
