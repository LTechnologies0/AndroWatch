name: Feature request
description: Suggest a new collector or UI improvement
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: What fingerprinting or privacy question are you trying to answer?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: dropdown
    id: tier
    attributes:
      label: Suggested tier
      options:
        - Passive
        - Permissioned
        - Advanced
        - Unsure
