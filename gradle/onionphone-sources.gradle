// Exclude legacy package trees from compilation (dev.nompr / com.*).
android {
    sourceSets {
        main {
            java {
                exclude("dev/nompr/**")
            }
            kotlin {
                exclude("com/securefilemanager/**")
                exclude("com/androwatch/**")
            }
        }
        test {
            java {
                exclude("dev/nompr/**")
            }
            kotlin {
                exclude("com/securefilemanager/**")
            }
        }
        androidTest {
            java {
                exclude("dev/nompr/**")
            }
        }
    }
}
